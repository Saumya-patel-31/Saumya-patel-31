name: system sync

on:
  # refresh the Status Window and Daily Quest every 6 hours
  schedule:
    - cron: "23 */6 * * *"
  # lets you run it manually from the Actions tab
  workflow_dispatch:
  # also run on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: system-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # purple shadow snake on System-blue tiles (first dot color = empty cell)
          outputs: |
            snake/snake.svg?color_snake=#a855f7&color_dots=#0c1a30,#0c3d66,#0369a1,#0ea5e9,#7dd3fc

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: render status window and daily quest
        run: python3 scripts/build.py live --snake snake/snake.svg --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
