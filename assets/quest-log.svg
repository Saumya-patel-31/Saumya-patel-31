<svg xmlns="http://www.w3.org/2000/svg" width="900" height="74" viewBox="0 0 900 74" role="img" aria-label="Quest log"><title>Quest log</title><style>
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.corner{animation:corner-pulse 3.2s ease-in-out infinite}
@keyframes corner-pulse{0%,100%{opacity:.55}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fade .8s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}
.open{transform-box:fill-box;transform-origin:center;animation:open .75s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes open{0%{opacity:0;transform:scale(.55,.02)}45%{opacity:1;transform:scale(1,.02)}100%{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) .4s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.mote{animation:mote linear infinite both}
@keyframes mote{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}80%{opacity:.6}100%{opacity:0;transform:translateY(var(--rise))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0b1a33" stop-opacity=".97"/>
  <stop offset="1" stop-color="#060f21" stop-opacity=".98"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
  <stop offset=".85" stop-color="#38bdf8" stop-opacity=".04"/>
  <stop offset="1" stop-color="#7dd3fc" stop-opacity=".12"/>
</linearGradient>
<linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38bdf8"/>
  <stop offset="1" stop-color="#a855f7"/>
</linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24" fill="none" stroke="#1c3454" stroke-width=".6" opacity=".55"/>
</pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="2.4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glow-strong" x="-50%" y="-80%" width="200%" height="260%">
  <feGaussianBlur stdDeviation="7" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs><path d="M28 29H361.8M538.2 29H872" stroke="#38bdf8" stroke-opacity=".35"/><path d="M361.8 25l4 4-4 4-4-4zM538.2 25l4 4-4 4-4-4z" fill="#38bdf8"/><text x="453" y="34" class="sans" font-size="15" fill="#e6f4ff" text-anchor="middle" font-weight="700" letter-spacing="6" filter="url(#glow)">QUEST LOG</text><text x="450" y="62" class="mono" font-size="11" fill="#7f9ec2" text-anchor="middle">4 gates open · select one to enter</text></svg>
